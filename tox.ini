[tox]
envlist = py{38,39,310,311,312,313}-dj{22,31,32,42,50,52,60}
skip_missing_interpreters = true

[testenv]
deps =
    pytest
    pytest-django
    dj22: Django>=2.2,<3.0
    dj31: Django>=3.1,<3.2
    dj32: Django>=3.2,<4.0
    dj42: Django>=4.2,<5.0
    dj50: Django>=5.0,<5.1
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<7.0
commands = pytest tests/ -v
setenv =
    PYTHONDONTWRITEBYTECODE=1

[testenv:lint]
deps = ruff
skip_install = true
commands = ruff check django_editorjs_fields/ tests/
