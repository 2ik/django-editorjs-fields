name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check django_editorjs_fields/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django:
          - "2.2"
          - "3.1"
          - "3.2"
          - "4.2"
          - "5.0"
          - "5.2"
          - "6.0"
        include:
          - django: "2.2"
            django-upper: "3.0"
            python-version: "3.8"
          - django: "3.1"
            django-upper: "3.2"
            python-version: "3.8"
          - django: "3.2"
            django-upper: "3.3"
            python-version: "3.8"
          - django: "3.2"
            django-upper: "3.3"
            python-version: "3.9"
          - django: "4.2"
            django-upper: "4.3"
            python-version: "3.8"
          - django: "4.2"
            django-upper: "4.3"
            python-version: "3.9"
          - django: "4.2"
            django-upper: "4.3"
            python-version: "3.10"
          - django: "4.2"
            django-upper: "4.3"
            python-version: "3.11"
          - django: "4.2"
            django-upper: "4.3"
            python-version: "3.12"
          - django: "4.2"
            django-upper: "4.3"
            python-version: "3.13"
          - django: "5.0"
            django-upper: "5.1"
            python-version: "3.10"
          - django: "5.0"
            django-upper: "5.1"
            python-version: "3.11"
          - django: "5.0"
            django-upper: "5.1"
            python-version: "3.12"
          - django: "5.0"
            django-upper: "5.1"
            python-version: "3.13"
          - django: "5.2"
            django-upper: "5.3"
            python-version: "3.10"
          - django: "5.2"
            django-upper: "5.3"
            python-version: "3.11"
          - django: "5.2"
            django-upper: "5.3"
            python-version: "3.12"
          - django: "5.2"
            django-upper: "5.3"
            python-version: "3.13"
          - django: "6.0"
            django-upper: "6.1"
            python-version: "3.12"
          - django: "6.0"
            django-upper: "6.1"
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel build
          pip install pytest pytest-django "Django>=${{ matrix.django }},<${{ matrix.django-upper }}"
          pip install -e .
      - name: Run tests
        run: pytest tests/ -v
